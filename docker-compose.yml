services:
  # Local MongoDB as a one-node replica set (needed for transactions, same as Atlas)
  mongo:
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"  # 27018 on the host, so it never clashes with a locally installed MongoDB
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  # Runs pending migrations once mongo is healthy, then exits
  migrate:
    build: ./backend
    command: ["npm", "run", "migrate"]
    env_file: ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/seatly?directConnection=true
    volumes:
      - ./backend/src:/app/src:ro
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

volumes:
  mongo-data:
